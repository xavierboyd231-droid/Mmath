<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning-68 Arcade | Unblocked Games</title>
    <style>
        :root {
            --bg-deep: #0f141d;
            --surface: #181f2d;
            --surface-hover: #222b3d;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #263147;
        }

        * { box-sizing: border-box; }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: rgba(24, 31, 45, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #818cf8, #e879f9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .search-bar {
            width: 100%;
            max-width: 350px;
            padding: 10px 16px;
            background: rgba(15, 20, 29, 0.7);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
        }
        .search-bar:focus { border-color: var(--accent); box-shadow: 0 0 12px var(--accent-glow); }

        .categories-nav {
            display: flex;
            gap: 8px;
            padding: 15px 30px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .categories-nav::-webkit-scrollbar { display: none; }

        .cat-pill {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .cat-pill:hover, .cat-pill.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .main-container {
            max-width: 1400px;
            margin: 10px auto 40px auto;
            padding: 0 30px;
            flex: 1;
            width: 100%;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .game-card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }
        .game-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
        }

        .game-thumb {
            width: 100%;
            height: 120px;
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .game-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex: 1;
        }

        .game-name {
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .game-cat {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        /* Modal Preview Overlay */
        #modalOverlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(8, 11, 17, 0.85);
            backdrop-filter: blur(8px);
            z-index: 200;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            width: 100%;
            max-width: 600px;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            animation: modalPop 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes modalPop {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal-banner {
            width: 100%;
            height: 240px;
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .modal-content {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .modal-title {
            font-size: 1.8rem;
            font-weight: 800;
            margin: 0;
        }

        .modal-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        .btn-primary {
            flex: 1;
            background: var(--accent);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            text-align: center;
        }
        .btn-primary:hover { background: #4f46e5; }

        .btn-secondary {
            background: rgba(255,255,255,0.05);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 14px 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-secondary:hover { background: var(--surface-hover); }

        /* Fullscreen Player View */
        #playerView {
            display: none;
            flex-direction: column;
            flex: 1;
            max-width: 1400px;
            margin: 20px auto;
            width: 100%;
            padding: 0 30px;
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            background: var(--surface);
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .frame-container {
            position: relative;
            width: 100%;
            height: 78vh;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <header>
        <div class="logo">🎮 Learning-68 Arcade</div>
        <input type="text" id="searchBox" class="search-bar" placeholder="Search games..." onkeyup="filterGames()">
    </header>

    <div class="categories-nav" id="catNav">
        <button class="cat-pill active" onclick="setCategory('All')">🔥 All Games</button>
        <button class="cat-pill" onclick="setCategory('Sports')">🏈 Sports</button>
        <button class="cat-pill" onclick="setCategory('Action')">⚔️ Action</button>
        <button class="cat-pill" onclick="setCategory('Racing')">🏎️ Racing</button>
        <button class="cat-pill" onclick="setCategory('Arcade')">🟢 Arcade</button>
        <button class="cat-pill" onclick="setCategory('Puzzle')">🧩 Puzzle</button>
        <button class="cat-pill" onclick="setCategory('Runner')">🏃 Runner</button>
    </div>

    <!-- Main Catalog Grid -->
    <div class="main-container" id="catalogView">
        <div class="grid" id="gameGrid"></div>
    </div>

    <!-- Modal Preview Card -->
    <div id="modalOverlay" onclick="closeModal(event)">
        <div class="modal-box" onclick="event.stopPropagation()">
            <div class="modal-banner" id="modalBanner"></div>
            <div class="modal-content">
                <div>
                    <h2 class="modal-title" id="modalTitle">Game Title</h2>
                    <div id="modalCat" style="font-size: 0.8rem; color: var(--accent); font-weight: bold; margin-top: 4px;">CATEGORY</div>
                </div>
                <p class="modal-desc" id="modalDesc">Ready to play instantly in your browser? No downloads required. Jump straight into the action!</p>
                <div class="modal-actions">
                    <button class="btn-primary" id="modalPlayBtn">▶ Play Now</button>
                    <button class="btn-secondary" onclick="closeModal()">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Active Game Player View -->
    <div id="playerView">
        <div class="player-header">
            <button class="btn-secondary" onclick="goHome()">← Back to Library</button>
            <div id="nowPlayingTitle" style="font-weight: bold; font-size: 1.1rem;"></div>
            <button class="btn-secondary" onclick="toggleFullscreen()">🖵 Fullscreen</button>
        </div>
        <div class="frame-container" id="frameBox">
            <iframe id="gameFrame" src=""></iframe>
        </div>
    </div>

    <script>
        // High-reliability unblocked games list featuring Basketball Legends and other working hits
        const popularGames = [
            { name: "Basketball Legends", cat: "Sports", img: "https://images.unsplash.com/photo-1546519638-68e109498ffc?w=500&q=80", url: "https://basketbros.io/" },
            { name: "Retro Bowl", cat: "Sports", img: "https://images.unsplash.com/photo-1566951324795-67c30982e56e?w=500&q=80", url: "https://retrobowl.me/" },
            { name: "Boxing Random", cat: "Sports", img: "https://images.unsplash.com/photo-1549719386-74dfcbf7dbed?w=500&q=80", url: "https://boxingrandom.io/" },
            { name: "Soccer Random", cat: "Sports", img: "https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=500&q=80", url: "https://soccer-random.io/" },
            { name: "Slope", cat: "Arcade", img: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=500&q=80", url: "https://kdata1.com/2020/10/slope/" },
            { name: "Moto X3M", cat: "Racing", img: "https://images.unsplash.com/photo-1558981806-ec527fa84c39?w=500&q=80", url: "https://images-opensocial.googleusercontent.com/gadgets/ifr?url=https://cdn.jsdelivr.net/gh/classroom6x/classroom6x.github.io@master/moto-x3m/index.xml" },
            { name: "Drift Hunters", cat: "Racing", img: "https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=500&q=80", url: "https://drifthunters.co/" },
            { name: "Smash Karts", cat: "Action", img: "https://images.unsplash.com/photo-1511919884226-fd3cad34687c?w=500&q=80", url: "https://smashkarts.io/" },
            { name: "Shell Shockers", cat: "Action", img: "https://images.unsplash.com/photo-1563089145-599997674d42?w=500&q=80", url: "https://shellshock.io/" },
            { name: "Subway Surfers", cat: "Runner", img: "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=500&q=80", url: "https://subwaysurfers.com/" },
            { name: "Temple Run 2", cat: "Runner", img: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=500&q=80", url: "https://poki.com/en/g/temple-run-2" },
            { name: "Tunnel Rush", cat: "Arcade", img: "https://images.unsplash.com/photo-1508739773434-c26b3d09e071?w=500&q=80", url: "https://tunnelrush.co/" },
            { name: "OvO", cat: "Action", img: "https://images.unsplash.com/photo-1579546929518-9e396f3cc809?w=500&q=80", url: "https://ovogame.io/" },
            { name: "Stickman Hook", cat: "Arcade", img: "https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1?w=500&q=80", url: "https://stickmanhook.co/" },
            { name: "Run 3", cat: "Runner", img: "https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=500&q=80", url: "https://run3.co/" },
            { name: "Cookie Clicker", cat: "Puzzle", img: "https://images.unsplash.com/photo-1499636136210-6f4ee915583e?w=500&q=80", url: "https://orteil.dashnet.org/cookieclicker/" }
        ];

        let currentCategory = 'All';

        function renderGrid(filter = "") {
            const grid = document.getElementById('gameGrid');
            grid.innerHTML = "";

            const filtered = popularGames.filter(game => {
                const matchesSearch = game.name.toLowerCase().includes(filter) || game.cat.toLowerCase().includes(filter);
                if (currentCategory === 'All') return matchesSearch;
                return matchesSearch && game.cat === currentCategory;
            });

            filtered.forEach(game => {
                const card = document.createElement('div');
                card.className = "game-card";
                card.onclick = () => openModal(game);
                card.innerHTML = `
                    <div class="game-thumb" style="background-image: url('${game.img}')"></div>
                    <div class="game-info">
                        <div class="game-name">${game.name}</div>
                        <div class="game-cat">${game.cat}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function setCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-pill').forEach(pill => {
                pill.classList.toggle('active', pill.innerText.includes(cat) || (cat === 'All' && pill.innerText.includes('All')));
            });
            filterGames();
        }

        function filterGames() {
            const query = document.getElementById('searchBox').value.toLowerCase();
            renderGrid(query);
        }

        function openModal(game) {
            document.getElementById('modalBanner').style.backgroundImage = `url('${game.img}')`;
            document.getElementById('modalTitle').innerText = game.name;
            document.getElementById('modalCat').innerText = game.cat.toUpperCase();
            document.getElementById('modalPlayBtn').onclick = () => launchGame(game.url, game.name);
            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
        }

        function launchGame(url, name) {
            closeModal();
            document.getElementById('catalogView').style.display = 'none';
            document.getElementById('catNav').style.display = 'none';
            document.getElementById('playerView').style.display = 'flex';
            document.getElementById('nowPlayingTitle').innerText = name;
            document.getElementById('gameFrame').src = url;
        }

        function goHome() {
            document.getElementById('gameFrame').src = ""; 
            document.getElementById('playerView').style.display = 'none';
            document.getElementById('catalogView').style.display = 'block';
            document.getElementById('catNav').style.display = 'flex';
        }

        function toggleFullscreen() {
            const frame = document.getElementById('frameBox');
            if (!document.fullscreenElement) {
                frame.requestFullscreen().catch(err => alert(err.message));
            } else {
                document.exitFullscreen();
            }
        }

        renderGrid();
    </script>
</body>
</html>
